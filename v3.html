<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Sort v3</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 0 28px;
      background: #0e0e10;
      overflow: auto;
    }

    #upload {
      display: none;
    }

    .upload-btn,
    .blur-btn {
      border: 2px solid #f3f3f3;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      transition: transform 150ms ease;
    }

    .upload-btn {
      width: 68px;
      height: 68px;
      position: fixed;
      inset: 0;
      margin: auto;
      z-index: 2;
    }

    .upload-btn::before,
    .upload-btn::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 26px;
      height: 2px;
      background: #f3f3f3;
      transform: translate(-50%, -50%);
    }

    .upload-btn::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .blur-btn {
      display: none;
      position: static;
      margin-top: 18px;
      min-width: 108px;
      height: 44px;
      padding: 0 20px;
      color: #f3f3f3;
      font: 600 12px/1 "Courier New", monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 1;
    }

    .upload-btn:hover,
    .blur-btn:hover {
      transform: scale(1.06);
    }

    #canvas {
      display: none;
      image-rendering: pixelated;
      max-width: none;
      max-height: none;
    }

    body.has-image #canvas {
      display: block;
    }

    body.has-image .upload-btn {
      display: none;
    }

    body.has-image .blur-btn {
      display: block;
    }
  </style>
</head>
<body>
  <input id="upload" type="file" accept="image/*" />
  <label class="upload-btn" for="upload" aria-label="Upload"></label>
  <canvas id="canvas"></canvas>
  <button id="blur-btn" class="blur-btn" type="button" aria-label="Blur">Blur</button>

  <script>
    const BLUR_PX = 100;

    const upload = document.getElementById("upload");
    const blurButton = document.getElementById("blur-btn");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    const sourceCanvas = document.createElement("canvas");
    const sourceCtx = sourceCanvas.getContext("2d", { willReadFrequently: true });

    const blurCanvas = document.createElement("canvas");
    const blurCtx = blurCanvas.getContext("2d");

    let hasImage = false;

    function sortLightToDark(data, width, height) {
      const pixelCount = width * height;
      const pixels = new Array(pixelCount);

      for (let i = 0, p = 0; p < pixelCount; i += 4, p += 1) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const a = data[i + 3];
        const brightness = (0.2126 * r + 0.7152 * g + 0.0722 * b) * (a / 255);
        pixels[p] = [r, g, b, a, brightness];
      }

      pixels.sort((left, right) => right[4] - left[4]);

      for (let p = 0, i = 0; p < pixelCount; p += 1, i += 4) {
        const px = pixels[p];
        data[i] = px[0];
        data[i + 1] = px[1];
        data[i + 2] = px[2];
        data[i + 3] = px[3];
      }

    }

    function processCurrentImage() {
      const width = sourceCanvas.width;
      const height = sourceCanvas.height;
      if (!width || !height) return;

      const sourceImageData = sourceCtx.getImageData(0, 0, width, height);
      const sortedImageData = new ImageData(new Uint8ClampedArray(sourceImageData.data), width, height);
      sortLightToDark(sortedImageData.data, width, height);

      ctx.clearRect(0, 0, width, height);
      ctx.putImageData(sortedImageData, 0, 0);
      document.body.classList.add("has-image");
      hasImage = true;
    }

    upload.addEventListener("change", () => {
      const file = upload.files?.[0];
      if (!file) return;

      const imageUrl = URL.createObjectURL(file);
      const img = new Image();

      img.onload = () => {
        const width = img.naturalWidth;
        const height = img.naturalHeight;

        canvas.width = width;
        canvas.height = height;
        sourceCanvas.width = width;
        sourceCanvas.height = height;
        blurCanvas.width = width;
        blurCanvas.height = height;

        sourceCtx.clearRect(0, 0, width, height);
        sourceCtx.drawImage(img, 0, 0, width, height);

        processCurrentImage();
        upload.value = "";
        URL.revokeObjectURL(imageUrl);
      };

      img.onerror = () => {
        URL.revokeObjectURL(imageUrl);
      };

      img.src = imageUrl;
    });

    blurButton.addEventListener("click", () => {
      if (!hasImage) return;

      const width = sourceCanvas.width;
      const height = sourceCanvas.height;

      blurCtx.clearRect(0, 0, width, height);
      blurCtx.filter = `blur(${BLUR_PX}px)`;
      blurCtx.drawImage(sourceCanvas, 0, 0, width, height);
      blurCtx.filter = "none";

      sourceCtx.clearRect(0, 0, width, height);
      sourceCtx.drawImage(blurCanvas, 0, 0, width, height);

      processCurrentImage();
    });
  </script>
</body>
</html>
