<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Sort v2</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0e0e10;
      overflow: auto;
    }

    #upload {
      display: none;
    }

    .upload-btn {
      width: 68px;
      height: 68px;
      border: 2px solid #f3f3f3;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      position: fixed;
      inset: 0;
      margin: auto;
      z-index: 2;
      transition: transform 150ms ease;
    }

    .upload-btn::before,
    .upload-btn::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 26px;
      height: 2px;
      background: #f3f3f3;
      transform: translate(-50%, -50%);
    }

    .upload-btn::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .upload-btn:hover {
      transform: scale(1.06);
    }

    #canvas {
      display: none;
      image-rendering: pixelated;
      max-width: none;
      max-height: none;
    }

    body.has-image #canvas {
      display: block;
    }

    body.has-image .upload-btn {
      display: none;
    }
  </style>
</head>
<body>
  <input id="upload" type="file" accept="image/*" />
  <label class="upload-btn" for="upload" aria-label="Upload"></label>
  <canvas id="canvas"></canvas>

  <script>
    const upload = document.getElementById("upload");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    const clamp01 = (n) => Math.min(1, Math.max(0, n));
    const mix = (a, b, t) => a + (b - a) * t;

    function hueDistance(a, b) {
      const delta = Math.abs(a - b) % 360;
      return delta > 180 ? 360 - delta : delta;
    }

    function hueBandScore(h, center, halfWidth) {
      const d = hueDistance(h, center);
      if (d >= halfWidth) return 0;
      return 1 - d / halfWidth;
    }

    function rgbToHsv(r, g, b) {
      const rn = r / 255;
      const gn = g / 255;
      const bn = b / 255;
      const max = Math.max(rn, gn, bn);
      const min = Math.min(rn, gn, bn);
      const delta = max - min;

      let h = 0;
      if (delta !== 0) {
        if (max === rn) h = ((gn - bn) / delta) % 6;
        else if (max === gn) h = (bn - rn) / delta + 2;
        else h = (rn - gn) / delta + 4;
        h *= 60;
        if (h < 0) h += 360;
      }

      const s = max === 0 ? 0 : delta / max;
      const v = max;
      return [h, s, v];
    }

    function verticalRank(r, g, b, a) {
      const alpha = a / 255;
      const brightness = ((0.2126 * r + 0.7152 * g + 0.0722 * b) / 255) * alpha;
      const [h, s, v] = rgbToHsv(r, g, b);

      let rank = 1 - brightness;

      const blue = hueBandScore(h, 220, 45);
      const pink = hueBandScore(h, 330, 40);
      const red = hueBandScore(h, 5, 28);
      const orange = hueBandScore(h, 28, 26);
      const skySunScore = Math.max(blue, pink, red, orange) * s;
      rank = mix(rank, 0.52, 0.45 * skySunScore);

      const green = hueBandScore(h, 115, 55);
      const yellow = hueBandScore(h, 60, 35);
      const brown = hueBandScore(h, 35, 28) * (1 - v * 0.55);
      const earthScore = Math.max(green, yellow, brown) * (0.4 + 0.6 * s);
      rank = mix(rank, 0.8, 0.38 * earthScore);

      const deepScore = s * (1 - brightness);
      rank = mix(rank, 0.92, 0.28 * deepScore);

      return [clamp01(rank), brightness];
    }

    upload.addEventListener("change", () => {
      const file = upload.files?.[0];
      if (!file) return;

      const imageUrl = URL.createObjectURL(file);
      const img = new Image();

      img.onload = () => {
        const width = img.naturalWidth;
        const height = img.naturalHeight;

        canvas.width = width;
        canvas.height = height;

        ctx.clearRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);

        const imageData = ctx.getImageData(0, 0, width, height);
        const data = imageData.data;
        const pixelCount = width * height;
        const pixels = new Array(pixelCount);

        for (let i = 0, p = 0; p < pixelCount; i += 4, p += 1) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const a = data[i + 3];
          const [rank, brightness] = verticalRank(r, g, b, a);
          pixels[p] = [r, g, b, a, rank, brightness];
        }

        pixels.sort((left, right) => {
          if (left[4] !== right[4]) return left[4] - right[4];
          return right[5] - left[5];
        });

        for (let p = 0, i = 0; p < pixelCount; p += 1, i += 4) {
          const px = pixels[p];
          data[i] = px[0];
          data[i + 1] = px[1];
          data[i + 2] = px[2];
          data[i + 3] = px[3];
        }

        ctx.putImageData(imageData, 0, 0);
        document.body.classList.add("has-image");
        URL.revokeObjectURL(imageUrl);
      };

      img.onerror = () => {
        URL.revokeObjectURL(imageUrl);
      };

      img.src = imageUrl;
    });
  </script>
</body>
</html>
